name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "rebuild/launcher-core-v1", "rebuild/product-grade-foundation", "fix/app-drawer-icon" ]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug variant (validation only)
        run: gradle assembleDebug testDebugUnitTest
  build:
    needs: validate
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:

      - name: Explain why release is skipped
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "Release APK not generated. Add the four permanent signing secrets in Settings > Secrets and variables > Actions. Debug APKs are never published." >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK for Realme Stick validation
        if: (github.ref == 'refs/heads/rebuild/product-grade-foundation' || github.ref == 'refs/heads/fix/app-drawer-icon')
        run: gradle assembleDebug
      - name: Upload test APK
        if: (github.ref == 'refs/heads/rebuild/product-grade-foundation' || github.ref == 'refs/heads/fix/app-drawer-icon')
        uses: actions/upload-artifact@v4
        with:
          name: launcher-lite-validation-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare persistent signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/minimal-tv-release.jks"
          chmod 600 "$RUNNER_TEMP/minimal-tv-release.jks"
      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/minimal-tv-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Upload signed APK
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: minimal-tv-launcher-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
